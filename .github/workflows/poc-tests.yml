name: PoC Backend Checks
on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/poc-tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/poc-tests.yml'

jobs:
  isolated-api-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - backend/api-gateway
          - backend/services/auth-users-service
          - backend/services/listado-applications-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r "${{ github.workspace }}/pytest-requirements.txt"
        working-directory: ${{ matrix.service }}
      - run: PYTHONPATH=. python -m pytest -q tests
        working-directory: ${{ matrix.service }}
